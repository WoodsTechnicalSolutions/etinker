timeout 30

default mmc-rootfs

menu title etinker [k3-am62x-sk] Boot Options:

label mmc-rootfs
	kernel /Image
	fdt /dtb/ti/k3-am625-sk.dtb
	append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 mtdparts=spi-nand0:512k(ospi.tiboot3),2m(ospi.tispl),4m(ospi.u-boot),256k(ospi.env),256k(ospi.env.backup),98048k@32m(ospi.rootfs),256k@130816k(ospi.phypattern) root=/dev/mmcblk1p2 rw rootfstype=ext4 rootwait
