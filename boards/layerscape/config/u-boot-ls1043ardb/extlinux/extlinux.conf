timeout 30

default nvme-rootfs

menu title etinker [ls1043ardb] Boot Options:

label mmc-rootfs
	kernel /Image
	fdt /fsl-ls1043a-rdb-etinker.dtb
	append console=ttyS0,115200n8 earlycon=uart8250,mmio,0x21c0500 mtdparts=60000000.nor:2m@0x100000(nor_bank0_uboot),40m@0x1100000(nor_bank0_fit),7m(nor_bank0_user),2m@0x4100000(nor_bank4_uboot),40m@0x5100000(nor_bank4_fit),-(nor_bank4_user);7e800000.flash:1m(nand_uboot),1m(nand_uboot_env),20m(nand_fit);spi0.0:1m(uboot),5m(kernel),1m(dtb),9m(file_system) root=/dev/mmcblk0p2 rw rootfstype=ext4 rootwait

label nvme-rootfs
	kernel /Image
	fdt /fsl-ls1043a-rdb-etinker.dtb
	append console=ttyS0,115200n8 earlycon=uart8250,mmio,0x21c0500 mtdparts=60000000.nor:2m@0x100000(nor_bank0_uboot),40m@0x1100000(nor_bank0_fit),7m(nor_bank0_user),2m@0x4100000(nor_bank4_uboot),40m@0x5100000(nor_bank4_fit),-(nor_bank4_user);7e800000.flash:1m(nand_uboot),1m(nand_uboot_env),20m(nand_fit);spi0.0:1m(uboot),5m(kernel),1m(dtb),9m(file_system) root=/dev/nvme0n1p1 rw rootfstype=ext4 rootwait

label initramfs
	kernel /Image
	initrd /rootfs.cpio.xz
	fdt /fsl-ls1043a-rdb-etinker.dtb
	append console=ttyS0,115200n8 earlycon=uart8250,mmio,0x21c0500 mtdparts=60000000.nor:2m@0x100000(nor_bank0_uboot),40m@0x1100000(nor_bank0_fit),7m(nor_bank0_user),2m@0x4100000(nor_bank4_uboot),40m@0x5100000(nor_bank4_fit),-(nor_bank4_user);7e800000.flash:1m(nand_uboot),1m(nand_uboot_env),20m(nand_fit);spi0.0:1m(uboot),5m(kernel),1m(dtb),9m(file_system)
